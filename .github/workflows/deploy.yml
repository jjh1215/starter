name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build jar
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/target/app.jar

  build-frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist/jar

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/frontend

      - name: Deploy backend
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          cp dist/jar/app.jar ~/starter/app.jar
          systemctl --user restart starter-backend

      - name: Deploy frontend
        run: |
          rm -rf ~/starter/frontend/dist_new
          mkdir -p ~/starter/frontend/dist_new
          cp -r dist/frontend/. ~/starter/frontend/dist_new/
          rm -rf ~/starter/frontend/dist_old
          if [ -d ~/starter/frontend/dist ]; then
            mv ~/starter/frontend/dist ~/starter/frontend/dist_old
          fi
          mv ~/starter/frontend/dist_new ~/starter/frontend/dist
          rm -rf ~/starter/frontend/dist_old
          restorecon -Rv ~/starter/frontend/dist
          sudo /usr/sbin/nginx -s reload
